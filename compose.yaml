services:
  black-numba:
    build: .
    image: black-numba:latest
    container_name: black-numba
    restart: unless-stopped
    environment:
      # Either set LICHESS_API_TOKEN here directly, or keep this empty and
      # mount api_token.txt below.
      LICHESS_API_TOKEN: ${LICHESS_API_TOKEN:-}
    # The polyglot opening book ships with the image at /app/book/Daring.bin
    # (the default for BLACK_NUMBA_BOOK). Override the env var if you want a
    # different book and mount it via a volume.
    stop_grace_period: 5s
