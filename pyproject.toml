[project]
name = "black-numba"
version = "0.2.0"
description = "Numba-enhanced bitboard chess engine"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Avo-k" }]
dependencies = [
    "numpy>=1.24",
    "numba>=0.59",
    "python-chess>=1.10",
    "berserk>=0.13",
    "requests>=2.31",
]

[project.scripts]
black-numba-uci = "black_numba.uci:main"
black-numba-lichess = "black_numba.lichess:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["black_numba"]
